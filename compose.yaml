name: mica-rom-manager

services:
  mica:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: mica-rom-manager:1.0.0
    container_name: mica-rom-manager
    restart: unless-stopped
    ports:
      - "${MICA_PORT:-8088}:8080"
    environment:
      MICA_PASSWORD: "${MICA_PASSWORD:?请在 .env 中设置 MICA_PASSWORD（至少 8 位）}"
      MICA_DATA_DIR: /data
      MICA_LIBRARY_ROOTS: "${MICA_LIBRARY_ROOTS:-/roms}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/data
      # 只读挂载：扫描/编辑/封面都可用；需要「整理文件名」时改成 :rw
      - "${ROM_ROOT:-./roms}:/roms:ro"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
